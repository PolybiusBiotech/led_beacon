name: Generate WireViz Diagrams

on:
  push:
    paths:
      - 'mechanical/**.yml'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-harnesses:
    runs-on: ubuntu-latest

    # Gives the action permission to write and commit files back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Graphviz and WireViz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz librsvg2-bin
          pip install wireviz

      - name: Create docs directory
        run: mkdir -p ./docs

      - name: Batch Process WireViz Files to PDF
        run: |
          # 1. Let WireViz natively generate full-featured SVGs (includes Frame & BOM)
          wireviz ./mechanical/*.yml -f s

          # 2. Convert the full SVGs into crisp vector PDFs directly inside ./docs
          for file in ./mechanical/*.svg; do
            [ -e "$file" ] || continue
            
            filename=$(basename -- "$file")
            basename="${filename%.*}"
            
            # rsvg-convert outputs clean vector PDFs while preserving fonts and layout frames
            rsvg-convert -f pdf "$file" -o "./docs/${basename}.pdf"
            echo "Successfully generated ./docs/${basename}.pdf"
          done

          # 3. Clean up the temporary SVG files from the source directory
          rm -f ./mechanical/*.svg

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate WireViz PDFs from mechanical/ [skip ci]"
          file_pattern: 'docs/*.pdf'
