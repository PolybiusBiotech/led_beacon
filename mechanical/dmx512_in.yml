      - 
        type: Crimp
        subtype: JST PH, 30-24 AWG
        qty_multiplier: populated
        manufacturer: '<a href="https://www.jst-mfg.com/index_e.php">JST</a>'
        mpn: '<a href="https://www.jst-mfg.com/product/index.php?series=199">SPH-002T-P0.5S</a>'

cables:
