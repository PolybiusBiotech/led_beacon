      -
        type: heatshrink
        subtype: 1.6mm dia, 5mm long
        qty_multiplier: populated

  J:
    type: JST PH 6way
    subtype: Housing
    pinlabels: [GND,DMX+,DMX-,AUX-,AUX+,SHIELD]
    manufacturer: '<a href="https://www.jst-mfg.com/index_e.php">JST</a>'
    mpn: '<a href="https://www.jst-mfg.com/product/index.php?series=199">PHR-6</a>'
