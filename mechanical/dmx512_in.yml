  template:
    name: din-6771
    sheetsize: A4

connectors:
  X:
    type: XLR 5way
    subtype: Pins
    manufacturer: '<a href="https://www.rean-connectors.com/en">Neutrik REAN</a>'
    mpn: '<a href="https://www.rean-connectors.com/en/product/rrx5m-z">RRX5M-Z-002-0</a>'
